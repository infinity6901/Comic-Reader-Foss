name: QA - Build, Test & Release

# End-to-end CI/QA & Release workflow for Comic-Reader-Foss:
#
#   verify         Stage 1 / Gate 1 : dependencies, Kotlin+Java compile, resources, manifest, debug APK,
#                                     unit tests, Android Lint, compiler/deprecation warnings, static-review hints
#   build-release  Release variant (R8 minify + shrink) + signature check
#   device-tests   Stage 2 (emulator): install + cold launch, background/foreground,
#                                     rotation, lock/unlock, process restart, crash/ANR detection, logcat capture
#   report         QA report (PASS / FAIL / PARTIAL / NOT RUN) + failure report published to Job Summary
#   release        Optional: GitHub Release with the APKs (workflow_dispatch -> publish_release or v* tag push)
#
# Artifacts (each uploaded separately, even when a job fails):
#   unit-test-reports | lint-reports | build-logs | comicreader-debug-apk-<ver> | comicreader-release-apk-<ver> |
#   release-build-logs | instrumented-test-reports | device-test-logs | device-logcat | qa-report | failure-report
#
# Signing (optional for CI, REQUIRED for publishing): supports both repo secret conventions:
#   - KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, KEYSTORE_PASSWORD (see docs/SIGNING.md)
#   - SIGN_KEY, ALIAS, KEY_PASSWORD, KEY_STORE_PASSWORD

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build the release (R8) APK'
        type: boolean
        default: true
      run_device_tests:
        description: 'Run the emulator tests (cold launch + lifecycle checks)'
        type: boolean
        default: true
      lifecycle_cycles:
        description: 'Repeat count for the emulator background/rotate/lock cycles'
        type: number
        default: 5
      strict_lint:
        description: 'Fail the run when Android Lint reports errors'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a GitHub Release with the APKs (needs signing secrets)'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (empty = v<versionName>-<short sha>)'
        type: string
        default: ''
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: true
  push:
    branches: [ 'main', 'master', 'v2.3-stable-signing', 'v2.4*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

concurrency:
  group: qa-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.plan.outputs.version_name }}
      build_release: ${{ steps.plan.outputs.build_release }}
      run_device: ${{ steps.plan.outputs.run_device }}
      cycles: ${{ steps.plan.outputs.cycles }}
      strict_lint: ${{ steps.plan.outputs.strict_lint }}
      publish: ${{ steps.plan.outputs.publish }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to run
        id: plan
        env:
          IN_BUILD_RELEASE: ${{ inputs.build_release }}
          IN_RUN_DEVICE: ${{ inputs.run_device_tests }}
          IN_CYCLES: ${{ inputs.lifecycle_cycles }}
          IN_STRICT_LINT: ${{ inputs.strict_lint }}
          IN_PUBLISH: ${{ inputs.publish_release }}
          IN_TAG: ${{ inputs.release_tag }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          BUILD_RELEASE="${IN_BUILD_RELEASE:-true}"
          RUN_DEVICE="${IN_RUN_DEVICE:-true}"
          CYCLES="${IN_CYCLES:-5}"
          STRICT="${IN_STRICT_LINT:-false}"
          PUBLISH="${IN_PUBLISH:-false}"
          PRERELEASE="${IN_PRERELEASE:-true}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PUBLISH="true"
            PRERELEASE="false"
          fi
          [ "$PUBLISH" = "true" ] && BUILD_RELEASE=true

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]*' app/build.gradle.kts)
          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${VERSION_NAME}-$(echo "$GITHUB_SHA" | cut -c1-7)"
            fi
          fi

          {
            echo "version_name=$VERSION_NAME"
            echo "build_release=$BUILD_RELEASE"
            echo "run_device=$RUN_DEVICE"
            echo "cycles=$CYCLES"
            echo "strict_lint=$STRICT"
            echo "publish=$PUBLISH"
            echo "release_tag=$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Plan: version=$VERSION_NAME release=$BUILD_RELEASE device=$RUN_DEVICE strict_lint=$STRICT publish=$PUBLISH tag=$TAG"

  # ------------------------------------------------------------------------------------------------
  # Stage 1 / Gate 1
  verify:
    name: "Gate 1: build + unit tests + lint"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      apk_built: ${{ steps.collect.outputs.apk_built }}
    env:
      VN: ${{ needs.plan.outputs.version_name }}
      STRICT_LINT: ${{ needs.plan.outputs.strict_lint }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android-build

      # Optional here: with the keystore the debug APK is signed with the same key as every other build
      # (installable over them); without it Gradle falls back to the Android debug key.
      - name: Decode keystore (if secrets are available)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
        run: |
          RAW_KEY="${KEYSTORE_B64:-$SIGN_KEY}"
          if [ -n "$RAW_KEY" ]; then
            mkdir -p "$HOME/work/_temp/keystore"
            echo "$RAW_KEY" | base64 -d > "$HOME/work/_temp/keystore/key.jks"
            chmod 600 "$HOME/work/_temp/keystore/key.jks"
            echo "KEYSTORE_FILE=$HOME/work/_temp/keystore/key.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets - the debug APK will use the default Android debug key."
          fi

      - name: Make gradlew and CI scripts executable
        run: chmod +x ./gradlew .github/scripts/*.sh

      - name: "1.1 Dependency resolution"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          CI_FAIL_IF_LOG_MATCHES: ' FAILED$'
        run: |
          source .github/scripts/ci-step.sh
          ci_step dependencies "Dependency resolution (debugRuntimeClasspath)" \
            ./gradlew :app:dependencies --configuration debugRuntimeClasspath

      - name: "1.1 Kotlin + Java compilation"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          source .github/scripts/ci-step.sh
          ci_step compile "Kotlin + Java compilation (:app debug)" \
            ./gradlew :app:compileDebugKotlin :app:compileDebugJavaWithJavac \
              --warning-mode all --no-build-cache --stacktrace
          mkdir -p compiler-warnings
          touch compiler-warnings/compiler-warnings.txt
          grep -E '^w: ' ci-logs/compile.log | sort -u > compiler-warnings/compiler-warnings.txt || true
          grep -iE 'deprecat' compiler-warnings/compiler-warnings.txt > compiler-warnings/deprecated-api-warnings.txt || true
          touch compiler-warnings/deprecated-api-warnings.txt
          echo "compiler warnings: $(wc -l < compiler-warnings/compiler-warnings.txt)," \
               "deprecations: $(wc -l < compiler-warnings/deprecated-api-warnings.txt)"

      - name: "1.1 Resource processing + manifest validation"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          source .github/scripts/ci-step.sh
          ci_step resources "Resource processing (:app debug)" ./gradlew :app:processDebugResources --stacktrace
          ci_step manifest "Manifest merge (:app debug)" ./gradlew :app:processDebugManifest --stacktrace

          mkdir -p manifests
          MM=$(find app/build -path '*merged_manifest*' -name AndroidManifest.xml | grep -i debug | head -n1 || true)
          REPORT=$(find app/build -name 'manifest-merger-*debug*-report.txt' | head -n1 || true)
          [ -n "$MM" ] && cp "$MM" manifests/AndroidManifest.merged.xml
          [ -n "$REPORT" ] && cp "$REPORT" manifests/manifest-merger-report.txt
          ci_step manifest-content "Merged manifest is well-formed and declares ListActivity and ViewerActivity" python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          p = "manifests/AndroidManifest.merged.xml"
          try:
              root = ET.parse(p).getroot()
          except (OSError, ET.ParseError) as e:
              print("cannot parse merged manifest:", e); sys.exit(1)
          ns = "{http://schemas.android.com/apk/res/android}name"
          activities = [a.get(ns) for a in root.iter("activity")]
          perms = [u.get(ns) for u in root.iter("uses-permission")]
          print("activities:", *activities, sep="\n  ")
          print("permissions:", *perms, sep="\n  ")
          if not any(n and n.endswith("ListActivity") for n in activities):
              print("ListActivity is not declared in the merged manifest"); sys.exit(1)
          if not any(n and n.endswith("ViewerActivity") for n in activities):
              print("ViewerActivity is not declared in the merged manifest"); sys.exit(1)
          PY

      - name: "1.1 Debug APK packaging"
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          source .github/scripts/ci-step.sh
          ci_step debug-apk "Assemble debug APK" ./gradlew :app:assembleDebug --stacktrace

      - name: Collect + verify debug APK
        id: collect
        run: |
          source .github/scripts/ci-step.sh
          mkdir -p out
          APK=$(find app/build/outputs/apk -path "*/debug/*" -name "*.apk" | head -n1 || true)
          if [ -n "$APK" ]; then
            cp "$APK" "out/comicreader-debug-$VN.apk"
            echo "apk_built=true" >> "$GITHUB_OUTPUT"
            ci_step apk-verify "Debug APK: package name, SDK/ABI info, valid signature" \
              bash .github/scripts/verify-apk.sh "out/comicreader-debug-$VN.apk"
          else
            echo "apk_built=false" >> "$GITHUB_OUTPUT"
            ci_record apk-verify FAIL "Debug APK was not produced" 1
          fi

      - name: "1.2 Automated unit tests"
        run: |
          source .github/scripts/ci-step.sh
          ci_step unit-tests "Unit tests (:app:testDebugUnitTest)" \
            ./gradlew :app:testDebugUnitTest --continue --no-build-cache --stacktrace

      - name: "1.3 Android Lint"
        run: |
          source .github/scripts/ci-step.sh
          ci_step lint "Android Lint (:app:lintDebug)" \
            ./gradlew :app:lintDebug --continue --stacktrace

      - name: "1.3 Static review hints (heuristic, informational)"
        if: ${{ !cancelled() }}
        run: bash .github/scripts/static-review.sh static-review

      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/test-results/test*UnitTest/**
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ci-logs/
            ci-status/
            compiler-warnings/
            static-review/
            manifests/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload debug APK
        if: ${{ !cancelled() && steps.collect.outputs.apk_built == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: comicreader-debug-apk-${{ needs.plan.outputs.version_name }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Enforce Gate 1
        if: ${{ !cancelled() }}
        run: |
          FAIL=0
          ls ci-status/*.tsv > /dev/null 2>&1 || { echo "::error::No check results were recorded"; exit 1; }
          for f in ci-status/*.tsv; do
            IFS=$'\t' read -r id status rc desc < "$f"
            [ "$status" = "FAIL" ] || continue
            if [ "$id" = "lint" ] && [ "$STRICT_LINT" != "true" ]; then
              echo "::warning title=Lint reported problems::$desc (not failing the run: strict_lint=false)"
              continue
            fi
            echo "::error title=Gate 1 failed::$id - $desc"; FAIL=1
          done
          exit $FAIL

  # ------------------------------------------------------------------------------------------------
  build-release:
    name: Release APK (R8)
    needs: plan
    if: needs.plan.outputs.build_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VN: ${{ needs.plan.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android-build

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          RAW_KEY="${KEYSTORE_B64:-$SIGN_KEY}"
          RAW_ALIAS="${KEY_ALIAS:-$ALIAS}"
          RAW_STORE_PWD="${KEYSTORE_PASSWORD:-$KEY_STORE_PASSWORD}"
          if [ -n "$RAW_KEY" ] && [ -n "$RAW_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$RAW_STORE_PWD" ]; then
            mkdir -p "$HOME/work/_temp/keystore"
            echo "$RAW_KEY" | base64 -d > "$HOME/work/_temp/keystore/key.jks"
            chmod 600 "$HOME/work/_temp/keystore/key.jks"
            test -s "$HOME/work/_temp/keystore/key.jks"
            echo "KEYSTORE_FILE=$HOME/work/_temp/keystore/key.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Publishing needs the signing secrets (KEYSTORE_BASE64/SIGN_KEY, KEY_ALIAS/ALIAS, KEY_PASSWORD, KEYSTORE_PASSWORD/KEY_STORE_PASSWORD). See docs/SIGNING.md."
              exit 1
            fi
            echo "::warning::No signing secrets: the release APK will fall back to the debug key."
          fi

      - name: Build release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          chmod +x ./gradlew .github/scripts/*.sh
          source .github/scripts/ci-step.sh
          ci_step release-apk "Assemble release APK (R8 minify + shrink)" ./gradlew :app:assembleRelease --stacktrace

          mkdir -p out
          APK=$(find app/build/outputs/apk -path "*/release/*" -name "*.apk" | head -n1 || true)
          if [ -z "$APK" ]; then
            ci_record release-apk FAIL "Release APK was not produced" 1
            ci_record release-apk-verify FAIL "Release APK was not produced" 1
          else
            cp "$APK" "out/comicreader-release-$VN.apk"
            ci_step release-apk-verify "Release APK: package name + valid signature" \
              bash .github/scripts/verify-apk.sh "out/comicreader-release-$VN.apk"
          fi
          mkdir -p release-extras
          find app/build/outputs/mapping -type f -exec cp {} release-extras/ \; 2>/dev/null || true

      - name: Upload release APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: comicreader-release-apk-${{ needs.plan.outputs.version_name }}
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release build logs (+ R8 mapping)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: |
            ci-logs/
            ci-status/
            release-extras/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if the release build failed
        if: ${{ !cancelled() }}
        run: |
          FAIL=0
          for f in ci-status/*.tsv; do
            IFS=$'\t' read -r id status rc desc < "$f"
            [ "$status" = "FAIL" ] && { echo "::error::$id - $desc"; FAIL=1; }
          done
          exit $FAIL

  # ------------------------------------------------------------------------------------------------
  # Stage 2: automated emulator lifecycle & crash/ANR checks
  device-tests:
    name: "Stage 2: emulator checks"
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.plan.outputs.run_device == 'true' && needs.verify.outputs.apk_built == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VN: ${{ needs.plan.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android-build

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: comicreader-debug-apk-${{ needs.plan.outputs.version_name }}
          path: apks

      - name: Make scripts executable
        run: chmod +x ./gradlew .github/scripts/*.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/device-tests.sh apks/comicreader-debug-${{ needs.plan.outputs.version_name }}.apk device-out ${{ needs.plan.outputs.cycles }}

      - name: Upload logcat and final screen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-logcat
          path: |
            device-out/comicreader-logcat.txt
            device-out/logcat-crash.txt
            device-out/final-screen.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload device test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: device-test-logs
          path: |
            device-out/ci-logs/
            device-out/ci-status/
            device-out/*.txt
            !device-out/comicreader-logcat.txt
            !device-out/logcat-crash.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce emulator checks
        if: ${{ !cancelled() }}
        run: |
          FAIL=0
          for f in device-out/ci-status/*.tsv; do
            [ -e "$f" ] || { echo "::error::no emulator results were recorded"; exit 1; }
            IFS=$'\t' read -r id status rc desc < "$f"
            [ "$status" = "FAIL" ] && { echo "::error title=Emulator check failed::$id - $desc"; FAIL=1; }
          done
          exit $FAIL

  # ------------------------------------------------------------------------------------------------
  report:
    name: QA + failure report
    needs: [plan, verify, build-release, device-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build reports
        env:
          VERSION_NAME: ${{ needs.plan.outputs.version_name }}
          STRICT_LINT: ${{ needs.plan.outputs.strict_lint }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 .github/scripts/qa_report.py artifacts report-out
          mkdir -p qa-report failure-report
          cp report-out/qa-report.md qa-report/
          cp report-out/failure-report.md failure-report/
          { cat report-out/qa-report.md; echo; echo '---'; echo; cat report-out/failure-report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report/
          retention-days: 90

      - name: Upload failure report
        uses: actions/upload-artifact@v4
        with:
          name: failure-report
          path: failure-report/
          retention-days: 90

  # ------------------------------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [plan, verify, build-release, device-tests, report]
    if: >-
      ${{ !cancelled()
          && needs.plan.outputs.publish == 'true'
          && needs.verify.result == 'success'
          && needs.build-release.result == 'success'
          && (needs.device-tests.result == 'success' || needs.device-tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs and QA report
        uses: actions/download-artifact@v4
        with:
          pattern: '{comicreader-debug-apk-*,comicreader-release-apk-*,qa-report}'
          merge-multiple: true
          path: release-files

      - name: Write release notes and checksums
        env:
          VN: ${{ needs.plan.outputs.version_name }}
          SHA: ${{ github.sha }}
        run: |
          (cd release-files && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "ComicReader FOSS build **$VN** from \`${SHA::7}\`."
            echo
            echo "> Built and tested by CI. See the attached \`qa-report.md\` and \`SHA256SUMS.txt\`."
            echo
            sed -n '/^## Release-readiness gates/,/^Release rule/p' release-files/qa-report.md | sed '$d'
          } > release-notes.md
          ls -la release-files

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ComicReader FOSS ${{ needs.plan.outputs.version_name }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-files/*.apk
            release-files/SHA256SUMS.txt
            release-files/qa-report.md
