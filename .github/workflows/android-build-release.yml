name: Android CI and FOSS Releases (Quick Build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGN_KEY: ${{ secrets.SIGN_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          RAW_KEY="${KEYSTORE_BASE64:-$SIGN_KEY}"
          RAW_ALIAS="${KEY_ALIAS:-$ALIAS}"
          RAW_STORE_PWD="${KEYSTORE_PASSWORD:-$KEY_STORE_PASSWORD}"
          if [ -n "$RAW_KEY" ] && [ -n "$RAW_STORE_PWD" ] && [ -n "$RAW_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RAW_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the stable key."
          else
            echo "::warning::No signing secrets; using Gradle's debug key."
          fi

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Build debug and release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Clean up temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Show signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256" || true

      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ComicReader-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/ComicReader-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comicreader-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30
